params:
  seed: 42

  algo:
    name: ase_drail

  model:
    name: ase_drail

  network:
    device_name: 'cuda:0'

    name: ase_drail
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        sigma_grad: True
    mlp:
      units: [512, 256, 128]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    disc:
      units: [256, 256, 256, 256]
      activation: elu

      initializer:
        name: default
      
      label_dim: 10
      diffusion_steps: 1000
      sample_strategy: other # constant
      sample_strategy_value: 0

    enc:
      units: [1024, 1024, 512]
      activation: relu
      separate: True

      initializer:
        name: default

  load_checkpoint: False
  load_path: ''

  config:
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False

    max_epochs: 7000
    save_best_after: 250
    save_frequency: 250
    save_intermediate: True
    save_intermediate_freq: 4000

    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False # not used for ASE
    num_actors: -1  # configured from the script (based on num_envs)
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    schedule_type: legacy
    kl_threshold: 0.008
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 1
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    bounds_loss_coef: 10.0
    bound_loss_type: bound

    amp_obs_demo_buffer_size: 200000
    amp_replay_buffer_size: 200000
    amp_replay_keep_prob: 0.01
    amp_batch_size: 32
    amp_minibatch_size: 1
    disc_coef: 5
    disc_logit_reg: 0.01
    disc_grad_penalty: 5
    disc_reward_scale: 2
    disc_weight_decay: 0.0001
    enable_eps_greedy: False

    normalize_amp_input: True

    latent_dim: 7
    latent_steps_min: 1
    latent_steps_max: 150

    amp_diversity_bonus: 0.01
    amp_diversity_tar: 1.0

    enc_coef: 5
    enc_weight_decay: 0.0000
    enc_reward_scale: 1
    enc_grad_penalty: 0

    task_reward_w: 0.0
    disc_reward_w: 0.5
    enc_reward_w: 0.5

    print_stats: True

    clip_actions: False

    player:
      random_latents_resets: False